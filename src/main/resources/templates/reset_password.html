<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(
        pageTitle='Reset your password',
        pageHeader='Set a new password',
        alert=${alert},
        content=~{::content}
      )}"
>
<div th:fragment="content">
    <form class="space-y-6" th:action="@{/user/reset_password}" th:object="${resetPasswordRequest}" method="POST">
        <div th:replace="~{fragments/input :: input(type='password', name='password', id='password', autocomplete='new-password', labelText='New password')}"></div>
        <div class="text-xs text-red-400" th:errors="*{password}" th:if="${#fields.hasErrors('password')}"></div>
        <div th:replace="~{fragments/input :: input(type='password', name='passwordConfirmation', id='passwordConfirmation', autocomplete='none', labelText='Confirm new password')}"></div>
        <div class="text-xs text-red-400" th:errors="*{passwordConfirmation}"
             th:if="${#fields.hasErrors('passwordConfirmation')}"></div>
        <input type="hidden" name="token" th:value="${resetPasswordRequest.token}"/>
        <div>
            <button type="submit"
                    class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                Reset password
            </button>
        </div>
    </form>
</div>
</html>
