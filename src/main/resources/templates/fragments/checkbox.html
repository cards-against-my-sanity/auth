<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="checkbox(name, id, labelText)">
    <div>
        <label th:for="${id}" class="block text-sm/6 font-medium text-gray-900" th:text="${labelText}"></label>
        <div class="mt-2">
            <!--suppress HtmlFormInputWithoutLabel -->
            <input th:type="checkbox" th:name="${name}" th:id="${id}" class="block rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">

        </div>
    </div>
</div>
</body>
</html>
