<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="alert(alert)" th:if="${alert != null}">
    <div th:with="type=${alert.type.name},message=${alert.message}"
         th:class="'border-l-4 p-4 mb-6 ' +
                (${type} == 'SUCCESS' ? 'border-green-400 bg-green-50'
                : (${type} == 'ERROR' ? 'border-red-400 bg-red-50'
                : (${type} == 'INFO' ? 'border-blue-400 bg-blue-50' : '')))">
        <div class="flex">
            <div class="shrink-0">
                <div>
                    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"
                         data-slot="icon"
                         th:class="'size-5 ' +
                            (${type} == 'SUCCESS' ? 'text-green-400'
                            : (${type} == 'ERROR' ? 'text-red-400'
                            : (${type} == 'INFO' ? 'text-blue-400' : '')))">
                        <path th:if="${type} == 'SUCCESS'" fill-rule="evenodd"
                              d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z"
                              clip-rule="evenodd"/>
                        <path th:if="${type} == 'ERROR'" fill-rule="evenodd"
                              d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM8.28 7.22a.75.75 0 0 0-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 1 0 1.06 1.06L10 11.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L11.06 10l1.72-1.72a.75.75 0 0 0-1.06-1.06L10 8.94 8.28 7.22Z"
                              clip-rule="evenodd"/>
                        <path th:if="${type} == 'INFO'" fill-rule="evenodd"
                              d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM9 9a.75.75 0 0 0 0 1.5h.253a.25.25 0 0 1 .244.304l-.459 2.066A1.75 1.75 0 0 0 10.747 15H11a.75.75 0 0 0 0-1.5h-.253a.25.25 0 0 1-.244-.304l.459-2.066A1.75 1.75 0 0 0 9.253 9H9Z"
                              clip-rule="evenodd"/>
                    </svg>
                </div>
            </div>
            <div class="ml-3">
                <p th:text="${message}"
                   th:class="'text-sm ' +
                            (${type} == 'SUCCESS' ? 'text-green-700'
                            : (${type} == 'ERROR' ? 'text-red-700'
                            : (${type} == 'INFO' ? 'text-blue-700' : '')))">No alert message provided</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
