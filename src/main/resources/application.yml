server:
  port: ${SERVER_PORT:8080}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

spring:
  application:
    name: cams-auth
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_SCHEMA_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          from: ${SMTP_FROM:root@localhost}
          port: ${SMTP_PORT:587}
          auth: ${SMTP_USE_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
  mvc:
    log-request-details: ${LOG_REQUEST_DETAILS:false}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
  session:
    timeout: ${SESSION_TIMEOUT_DURATION:6h}

auth:
  jwt-issuer-uri: ${AUTH_SERVER_ISSUER_URI:https://example.com}
  remember-me-key: ${AUTH_REMEMBER_ME_KEY:change-me-123}
  key:
    id: ${AUTH_KEY_ID:}
    path:
      public: ${AUTH_KEY_PUBLIC_PATH:}
      private: ${AUTH_KEY_PRIVATE_PATH:}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

pebble:
  expose-request-attributes: true