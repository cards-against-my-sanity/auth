name: Job set up
description: Check out code, set up Java 21, set up Gradle, cache Gradle packages
runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
